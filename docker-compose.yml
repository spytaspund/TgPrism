services:
  tgprism:
    build: .
    container_name: tgprism
    restart: always
    ports:
      - "${SERVER_PORT:-8000}:${SERVER_PORT:-8000}"
    volumes:
      - ./sessions:/app/sessions
    environment:
      - LOG_LEVEL
      - PROXY_TYPE
      - SERVER_PORT
      - SINGBOX_SUB
      - API_ID
      - API_HASH
  tg-ws-proxy:
    build:
      context: ../tg-ws-proxy
      dockerfile: Dockerfile
    container_name: tg-ws-proxy
    restart: always
    ports:
      - "1443:1443"
    environment:
      - TG_WS_PROXY_HOST=0.0.0.0
      - TG_WS_PROXY_PORT=1443
      - TG_WS_PROXY_SECRET=f84d65e62da4281a2efcad60cc3f2b9c